version: '3.8'

services:
  # Define the web service for our Flask application
  web:
    # Build the image using the Dockerfile in the current directory
    build: .
    # Name of the built Docker image
    image: flask-devops-app:latest
    # Name of the running container
    container_name: flask-app
    # Map port 5000 of the host to port 5000 of the container
    ports:
      - "5000:5000"
    # Restart the container automatically if it crashes or stops
    restart: always
